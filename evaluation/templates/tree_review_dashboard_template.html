<title>Tree Review Bench</title>
<style>
  :root {
    --bg: #F2F3F1;
    --surface: #FFFFFF;
    --surface-alt: #E9EAE6;
    --ink: #211F26;
    --ink-soft: #5B5763;
    --ink-faint: #8B8792;
    --border: #E1DFE6;
    --accent: #7A4A6B;
    --accent-soft: #F1E7ED;
    --warn: #A5710F;
    --warn-soft: #FAF1DE;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17151B; --surface: #1E1B24; --surface-alt: #262230;
      --ink: #EDEAF2; --ink-soft: #ABA6B8; --ink-faint: #75707F; --border: #322E3B;
      --accent: #CC93B6; --accent-soft: #33222E; --warn: #E0B84A; --warn-soft: #362B15;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17151B; --surface: #1E1B24; --surface-alt: #262230;
    --ink: #EDEAF2; --ink-soft: #ABA6B8; --ink-faint: #75707F; --border: #322E3B;
    --accent: #CC93B6; --accent-soft: #33222E; --warn: #E0B84A; --warn-soft: #362B15;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14.5px; line-height: 1.5; }
  *:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .app { display: flex; flex-direction: column; height: 100vh; min-height: 600px; }

  header {
    flex: none; border-bottom: 1px solid var(--border); background: var(--surface);
    padding: 0.85rem 1.25rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
  }
  h1 { font-size: 1.02rem; font-weight: 700; margin: 0 auto 0 0; letter-spacing: -0.01em; }
  .tabs { display: flex; gap: 0.3rem; background: var(--surface-alt); border-radius: 8px; padding: 0.2rem; }
  .tab {
    border: none; background: transparent; color: var(--ink-soft); font-size: 0.82rem; font-weight: 600;
    padding: 0.4rem 0.7rem; border-radius: 6px; cursor: pointer;
  }
  .tab.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }

  .main { flex: 1; display: flex; min-height: 0; }

  .tree-pane {
    width: 400px; flex: none; border-right: 1px solid var(--border); background: var(--surface);
    overflow-y: auto; padding: 0.7rem 0.5rem;
  }
  .node { margin-left: 0.9rem; }
  .node-row {
    display: flex; align-items: center; gap: 0.4rem; padding: 0.28rem 0.4rem; border-radius: 6px;
    cursor: pointer; font-size: 0.82rem;
  }
  .node-row:hover { background: var(--surface-alt); }
  .node-row.selected { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .caret { width: 12px; flex: none; font-size: 0.68rem; color: var(--ink-faint); }
  .node-row.leaf .caret { visibility: hidden; }
  .node-q { font-family: var(--font-mono); font-size: 0.8rem; }
  .node-thumb { width: 18px; height: 18px; border-radius: 4px; object-fit: cover; flex: none; }
  .node-children { display: none; }
  .node-children.open { display: block; }
  .node-count { color: var(--ink-faint); font-size: 0.72rem; margin-left: auto; padding-left: 0.4rem; }

  .detail-pane { flex: 1; overflow-y: auto; padding: 1.6rem 2rem 3rem; min-width: 0; }
  .empty { color: var(--ink-faint); font-size: 0.9rem; margin-top: 3rem; text-align: center; }

  .breadcrumb {
    font-family: var(--font-mono); font-size: 0.76rem; color: var(--ink-faint);
    display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; margin-bottom: 1rem;
  }
  .breadcrumb .seg { background: var(--surface-alt); border-radius: 4px; padding: 0.12rem 0.4rem; }
  .breadcrumb .arrow { opacity: 0.5; }

  .q-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.1rem 1.3rem; margin-bottom: 1.2rem; }
  .q-text { font-family: var(--font-mono); font-size: 1.05rem; font-weight: 600; text-wrap: balance; }
  .q-answers { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.75rem; }
  .ans-chip { font-family: var(--font-mono); font-size: 0.76rem; background: var(--surface-alt); color: var(--ink-soft); border-radius: 5px; padding: 0.22rem 0.55rem; }
  .reach-label { font-size: 0.72rem; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 1rem; margin-bottom: 0.4rem; }
  .class-strip { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .class-chip { display: flex; align-items: center; gap: 0.35rem; background: var(--surface-alt); border-radius: 999px; padding: 0.2rem 0.55rem 0.2rem 0.2rem; font-size: 0.72rem; color: var(--ink-soft); }
  .class-chip img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }

  .leaf-class-name { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.7rem; }
  .leaf-images { display: flex; gap: 0.7rem; margin-bottom: 1.1rem; }
  .leaf-images img { width: 140px; height: 140px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-alt); }
  .concern-badge { display: inline-flex; align-items: center; gap: 0.35rem; background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 0.3rem 0.6rem; font-size: 0.78rem; font-weight: 600; margin-bottom: 1rem; }

  .checklist-label { font-size: 0.72rem; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.04em; margin: 1.2rem 0 0.5rem; }
  .checklist { display: flex; flex-direction: column; gap: 0.45rem; }
  .check-item { display: flex; align-items: flex-start; gap: 0.55rem; font-size: 0.87rem; }
  .check-item input[type="checkbox"] { margin-top: 0.2rem; accent-color: var(--accent); flex: none; }
  .check-item label { color: var(--ink-soft); }
</style>

<div class="app">
  <header>
    <h1>Tree Review Bench</h1>
    <div class="tabs" id="datasetTabs"></div>
  </header>
  <div class="main">
    <div class="tree-pane" id="treePane"></div>
    <div class="detail-pane" id="detailPane"><div class="empty">Select a question or class on the left.</div></div>
  </div>
</div>

<script>
const TREE_DATA = __TREE_DATA_JSON__;

const NODE_CHECKS = [
  "Answerable from the image alone — no class-name or outside knowledge needed?",
  "Unambiguous — would two reviewers agree on the answer for a real image?",
  "Tests one visual attribute, not a bundled compound judgment?",
  "Neutral phrasing — describes a feature rather than hints at the class?",
  "Answer options are mutually exclusive and cover every class still in play here?",
  "Options are visually distinct, not near-synonyms of each other?",
];
const LEAF_CHECKS = [
  "Do the example images genuinely satisfy every answer on this class's path?",
  "No implausibly long detour — could a shorter path reach this class just as reliably?",
];

const KNOWN_CONCERNS = {
  GTSRB: {
    27: "Flagged in the paper's own Discussion: parent-subsumption with class 28.",
    28: "Flagged in the paper's own Discussion — check whether the discriminating question is answerable from a single static image.",
    33: "Arrow-direction class — flagged in §4.1 as hard to recover from the label alone without an image.",
    34: "Arrow-direction class — flagged in §4.1 as hard to recover from the label alone without an image.",
    35: "Arrow-direction class — flagged in §4.1 as hard to recover from the label alone without an image.",
    36: "Arrow-direction class — flagged in §4.1 as hard to recover from the label alone without an image.",
    37: "Arrow-direction class — flagged in §4.1 as hard to recover from the label alone without an image.",
  },
};

let currentDataset = Object.keys(TREE_DATA)[0];
let selectedPathKey = null;

function collectClasses(node) {
  if (node.leaf) return node.classes.slice();
  let acc = [];
  for (const a in node.children) acc = acc.concat(collectClasses(node.children[a]));
  return acc;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderTabs() {
  const el = document.getElementById("datasetTabs");
  el.innerHTML = "";
  Object.keys(TREE_DATA).forEach(name => {
    const btn = document.createElement("button");
    btn.className = "tab" + (name === currentDataset ? " active" : "");
    btn.textContent = name;
    btn.onclick = () => { currentDataset = name; selectedPathKey = null; renderTree(); renderTabs(); showEmpty(); };
    el.appendChild(btn);
  });
}

function buildNodeHtml(node, path, depth) {
  const key = path.map(p => p.a).join("|||") || "ROOT";
  const d = TREE_DATA[currentDataset];

  if (node.leaf) {
    const cls = node.classes[0];
    const thumb = (d.thumbs[String(cls)] || [])[0];
    const name = node.classes.map(c => d.class_names[String(c)] || ("#" + c)).join(" / ");
    return (
      '<div class="node-row leaf" data-key="' + escapeHtml(key) + '" data-type="leaf">' +
        '<span class="caret"></span>' +
        (thumb ? '<img class="node-thumb" src="' + thumb + '">' : '') +
        '<span>' + escapeHtml(name) + '</span>' +
      '</div>'
    );
  }

  const reachCount = collectClasses(node).length;
  const answerEntries = Object.entries(node.children);
  const open = depth < 1 ? " open" : "";
  const caret = depth < 1 ? "▾" : "▸";
  let html =
    '<div class="node-row" data-key="' + escapeHtml(key) + '" data-type="node" data-toggle="1">' +
      '<span class="caret">' + caret + '</span>' +
      '<span class="node-q">' + escapeHtml(node.question) + '</span>' +
      '<span class="node-count">' + reachCount + '</span>' +
    '</div>' +
    '<div class="node-children' + open + '">';
  answerEntries.forEach(([ans, child]) => {
    html += '<div class="node">' + buildNodeHtml(child, path.concat([{ a: ans }]), depth + 1) + '</div>';
  });
  html += '</div>';
  return html;
}

function renderTree() {
  const pane = document.getElementById("treePane");
  pane.innerHTML = buildNodeHtml(TREE_DATA[currentDataset].tree, [], 0);

  pane.querySelectorAll(".node-row").forEach(row => {
    row.addEventListener("click", (e) => {
      if (row.dataset.toggle) {
        const kids = row.nextElementSibling;
        kids.classList.toggle("open");
        row.querySelector(".caret").textContent = kids.classList.contains("open") ? "▾" : "▸";
      }
      selectNode(row.dataset.key, row.dataset.type);
    });
  });
}

function findNodeByKey(key) {
  const parts = key === "ROOT" ? [] : key.split("|||");
  let node = TREE_DATA[currentDataset].tree;
  let path = [];
  for (const ans of parts) {
    node = node.children[ans];
    path.push({ a: ans, q: null });
  }
  return { node, path };
}

function renderBreadcrumb(path) {
  let html = '<div class="breadcrumb"><span class="seg">root</span>';
  path.forEach(p => { html += '<span class="arrow">→</span><span class="seg">' + escapeHtml(p.a) + '</span>'; });
  return html + "</div>";
}

function selectNode(key, type) {
  document.querySelectorAll(".node-row").forEach(r => r.classList.remove("selected"));
  const target = document.querySelector('.node-row[data-key="' + CSS.escape(key) + '"][data-type="' + type + '"]');
  if (target) target.classList.add("selected");
  selectedPathKey = key;

  const { node, path } = findNodeByKey(key);
  const d = TREE_DATA[currentDataset];
  const pane = document.getElementById("detailPane");

  if (node.leaf) {
    let html = renderBreadcrumb(path);
    node.classes.forEach(c => {
      const name = d.class_names[String(c)] || ("#" + c);
      const thumbs = d.thumbs[String(c)] || [];
      const concern = (KNOWN_CONCERNS[currentDataset] || {})[c];
      html += '<div class="leaf-class-name">' + escapeHtml(name) + '</div>';
      if (concern) html += '<div class="concern-badge">⚠ ' + escapeHtml(concern) + '</div>';
      html += '<div class="leaf-images">' + thumbs.map(t => '<img src="' + t + '">').join("") +
        (thumbs.length === 0 ? '<div class="empty" style="margin:0;font-size:0.78rem;">no sample images available</div>' : '') +
        '</div>';
    });
    html += '<div class="checklist-label">Check as you verify</div><div class="checklist">' +
      LEAF_CHECKS.map((q, i) => '<div class="check-item"><input type="checkbox" id="lc' + i + '"><label for="lc' + i + '">' + escapeHtml(q) + '</label></div>').join("") +
      '</div>';
    pane.innerHTML = html;
  } else {
    const reachable = collectClasses(node).slice(0, 16);
    let html = renderBreadcrumb(path);
    html += '<div class="q-card"><div class="q-text">' + escapeHtml(node.question) + '</div>';
    html += '<div class="q-answers">' + node.answers.map(a => '<span class="ans-chip">' + escapeHtml(a) + '</span>').join("") + '</div>';
    html += '<div class="reach-label">' + collectClasses(node).length + ' classes reachable here' + (collectClasses(node).length > 16 ? " (showing 16)" : "") + '</div>';
    html += '<div class="class-strip">' + reachable.map(c => {
      const thumb = (d.thumbs[String(c)] || [])[0];
      const name = d.class_names[String(c)] || ("#" + c);
      return '<span class="class-chip">' + (thumb ? '<img src="' + thumb + '">' : "") + escapeHtml(name) + '</span>';
    }).join("") + '</div></div>';
    html += '<div class="checklist-label">Check as you verify</div><div class="checklist">' +
      NODE_CHECKS.map((q, i) => '<div class="check-item"><input type="checkbox" id="nc' + i + '"><label for="nc' + i + '">' + escapeHtml(q) + '</label></div>').join("") +
      '</div>';
    pane.innerHTML = html;
  }
}

function showEmpty() {
  document.getElementById("detailPane").innerHTML = '<div class="empty">Select a question or class on the left.</div>';
}

renderTabs();
renderTree();
</script>
